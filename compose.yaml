name: needradar-foundation

services:
  postgres:
    image: postgres:18.6-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
    environment:
      POSTGRES_DB: needradar
      POSTGRES_USER: needradar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-needradar_local}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - needradar-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U needradar -d needradar"]
      interval: 2s
      timeout: 3s
      retries: 30

  postgres-test:
    image: postgres:18.6-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: needradar_test
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:-needradar_test_local}
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U needradar_test -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  needradar-postgres:
